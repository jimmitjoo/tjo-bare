root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  bin = "./tmp/main"
  delay = 500
  exclude_dir = ["tmp", "vendor", "node_modules", ".git"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "jet", "html"]
  kill_delay = "0s"

[log]
  time = false

[color]
  main = "green"
  build = "yellow"
  runner = "cyan"

[misc]
  clean_on_exit = true
