# Local development services only. Every port is bound to 127.0.0.1 so nothing
# here is reachable from the network - the passwords below are placeholders and
# Redis has no authentication at all.
services:

#  start Postgres, and ensure that data is stored to a mounted volume
  postgres:
    image: 'postgres:17-alpine'
    ports:
      - "127.0.0.1:5432:5432"
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tjo
    volumes:
      - ./db-data/postgres/:/var/lib/postgresql/data/

  #  start Redis, and ensure that data is stored to a mounted volume
  redis:
    image: 'redis:alpine'
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    volumes:
      - ./db-data/redis/:/data

  # start Minio, and ensure that data is stored to a mounted volume
  minio:
    image: 'quay.io/minio/minio'
    command: server /mnt/data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: always
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: password
    volumes:
      - ./db-data/minio/:/mnt/data

  #  start MariaDB, and ensure that data is stored to a mounted volume
  mariadb:
    image: 'mariadb:11.4'
    ports:
      - "127.0.0.1:3306:3306"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: tjo
      MYSQL_USER: mariadb
      MYSQL_PASSWORD: password

    volumes:
      - ./db-data/mariadb:/var/lib/mysql
